commandes:
1- git --version : voir la version de git instaled

2- git init : before starting your project write this commande to make git initialized on your work

3- git config --global user.name "YOUR_NAME"      //the key word --global means that you set the name for git on all your laptop no need to do it again 

4- git config --global user.email "YOUR_Email"

5- git config --global --replace-all user.name OR .email "change name or change email" : to change the userName or email

6- git config --global init.defaultBranch main ||IF IT DIDN'T WORK|| git branch -m master main: to change the Branch name in this case we change it to main

7- git add FILE_NAME : to include a file in what will be committed(saved or achived)

we can say that git have tree zones: local zone //staging zone // zone head or savaugard
